name: iOS unsigned IPA

# 在 GitHub 托管的 macOS 上构建 Folia iOS 未签名 ipa。
# 运行环境二选一：macos-26（Xcode 26 GA，稳定）或 xcode-27（preview，iOS 27 SDK）。
# 产物是 Payload/ 结构的未签名 .ipa，需要用户用 Sideloadly / AltStore / Xcode 自签后安装。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner image'
        required: true
        default: 'macos-26'
        type: choice
        options:
          - macos-26
          - xcode-27
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned ipa
    runs-on: ${{ github.event.inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:capacitor

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry Folia-unsigned.ipa Payload
          ls -lh Folia-unsigned.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folia-unsigned-ipa
          path: ${{ runner.temp }}/Folia-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
